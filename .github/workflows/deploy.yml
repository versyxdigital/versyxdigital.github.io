# Builds the site and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that, every push to main deploys, and the
# workflow can also be run by hand from the Actions tab.
#
# The site is served at https://versyx.digital. The custom domain is set in
# Settings → Pages → Custom domain; with an Actions deployment that setting is
# what counts. public/CNAME records the same domain for reference.
#
# The build uses a relative base path (see vite.config.ts), so the same output
# also works at the github.io address.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, publish to Pages, and mint the OIDC token
# that the Pages deployment requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once. A newer push waits for the one in
# progress rather than cancelling it half-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gates as `npm run check`, minus the browser smoke test: that
      # one needs a real GPU for the WebGL field, which hosted runners lack.
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
